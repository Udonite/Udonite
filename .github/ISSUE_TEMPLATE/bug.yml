name: Bug
description: Udonite compiled something wrong, refused something it should accept, or stopped working after an update.
labels: [bug]
body:
  - type: input
    id: udonite
    attributes:
      label: Udonite version
      description: From the Creator Companion, or the release you installed.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: VRChat Worlds SDK version
      placeholder: 3.10.x
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: The Udonite compile line and anything logged around it. A refusal names the construct and its UDN code, which is usually the whole answer.
      render: text
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Smallest script that shows it
      description: Optional, and the single most useful thing you can add. Trim it to the behaviour that misbehaves.
      render: csharp
